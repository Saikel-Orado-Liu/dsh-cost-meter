name: compat.yml

# Runs the build and suite on every push to a release branch, testing only the
# pushed channel. Manual dispatch is the full three-channel sweep across the
# current npm DSH patches. There is deliberately no schedule.
on:
  push:
    branches: [main, next, alpha]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.select.outputs.branches }}
    steps:
      - id: select
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            printf 'branches=["%s"]\n' "${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            printf 'branches=["main","next","alpha"]\n' >> "$GITHUB_OUTPUT"
          fi

  channel:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.prepare.outputs.branches) }}
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show the DSH lines this run targets
        run: npm view @deepseek-ai/dsh dist-tags --json

      # No frozen lockfile: within the branch's declared range this resolves
      # the newest published DSH patch, exactly what a compatibility check
      # must exercise.
      - name: Install the channel's DSH patch
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
