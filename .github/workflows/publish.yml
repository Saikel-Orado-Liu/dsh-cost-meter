name: publish.yml

# Publishes the tagged commit and then reconciles npm dist-tags.
#
# The dist-tag is not derived from the version string alone: DSH ships two
# release lines at once (@deepseek-ai/dsh names the current one under `latest`
# and the upcoming one under `next`), and a plugin version only runs on the
# line its @deepseek-ai/dsh* peer ranges accept. scripts/dist-tag.mjs reads
# those ranges, reads the DSH lines from the registry, and picks `latest`,
# `next`, or `alpha` — the same judgement the runtime gate makes before it
# loads a bundle. The community market installs the bare package name, i.e.
# whatever `latest` names, so this choice decides whether a visitor's runtime
# accepts what the market just installed.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check if version is already published
        id: check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@gamegeek-saikel/dsh-cost-meter@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Version $PKG_VERSION already published; skipping publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.skip != 'true'
        run: |
          TAG=$(node scripts/dist-tag.mjs resolve)
          echo "publishing with dist-tag $TAG"
          npm publish --provenance --access public --tag "$TAG"

      # Re-points every tag at the newest published version that supports it, so
      # a release also repairs a tag an earlier release process set wrong.
      - name: Reconcile dist-tags
        run: node scripts/dist-tag.mjs reconcile
